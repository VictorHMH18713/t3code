name: Fork Desktop Release (macOS & Windows)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_macos_arm64:
    name: Build macOS (arm64 DMG)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Select Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_27*.app /Applications/Xcode.app 2>/dev/null | head -n 1 || true)"
          if [[ -n "$xcode_app" ]]; then
            sudo xcode-select -s "$xcode_app/Contents/Developer"
          fi
          xcodebuild -version || true
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=@t3tools/web... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: fork-resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin

      - name: Build macOS arm64 DMG (unsigned)
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --verbose
          ls -lh release/

      - name: Upload macOS DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-arm64
          path: release/*.dmg
          if-no-files-found: error
          compression-level: 0

  build_windows_x64:
    name: Build Windows (x64 NSIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=@t3tools/web... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache Windows resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: fork-resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Cargo and xwin SDK
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/cargo-xwin
            ~/.cargo/registry/cache
            native/resource-monitor/target/x86_64-pc-windows-msvc
          key: fork-win-rust-build-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml') }}
          restore-keys: fork-win-rust-build-

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Linux build dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install cargo-xwin
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build Windows resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Windows x64 NSIS installer (unsigned)
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --verbose
          ls -lh release/

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-x64
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0

  build_linux_x64_cli:
    name: Build Linux Server (x64 Archive)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...

      - name: Cache Linux resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: fork-resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y patchelf libsecret-1-dev pkg-config

      - name: Build Linux resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Build Linux x64 CLI archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/server/package.json','utf8')).version)")"
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            "$RUNNER_TEMP/cli-resource-monitor/linux-x64/t3-resource-monitor"
          vp run --filter t3 build
          node apps/server/scripts/cli.ts build-exe
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$version" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$version"
          ls -lh release-cli/

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish_release:
    name: Publish GitHub Release
    needs: [build_macos_arm64, build_windows_x64, build_linux_x64_cli]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macos-arm64
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows-x64
          path: artifacts

      - name: Download Linux CLI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: artifacts

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh artifacts/
          NOTES=$(cat <<'EOF'
          Unofficial personal fork build (not affiliated with or endorsed by T3 Tools, Inc.).

          ### Changes in this build
          - **Antigravity expired sign-in renewal**: When `antigravity-oauth-token` expires after >1h idle and `refresh_token` is present, quota probes silently renew the CLI token via `agy` (`initialize` + `authenticate`) without starting a session or spending quota, with a 15-minute failure cooldown.
          - **Sidebar Live Usage Panel**: Compact live usage & quota panel docked in the sidebar footer (`5h` / `7d` / `All` switcher, strictly grouped per provider with tokens & prompt-cache hit rate, non-clickable display with fast 150ms hover tooltips, collapsible 1-line bar).
          - **Composer Prompt-Cache Hit-Rate Strip**: Per-agent prompt-cache hit-rate badges directly below the composer for the current thread (with fast hover breakdown of cached/input/write tokens, turns, and latest-turn rate).
          - **Settings → Appearance → Interface**: Independent toggles to show or hide the sidebar live usage panel and the composer cache hit-rate strip.
          - **Slow-network provider resilience**: Retries Codex `account/read` once in the same probe process on startup `workspace routing discovery timed out`, extends Codex/Claude capability probe budgets (45s) & usage timeouts (20s), and extends Antigravity usage/OAuth probe timeouts (25s per request / 60s total).
          - Rebased onto `pingdotgg/t3code` `main` (`024da4f7`). Also attaches `t3-*-linux-x64.tar.gz` for Linux/WSL2 servers.

          ### Install notes (unsigned builds)
          - **macOS (Apple Silicon `.dmg`)**: If macOS Gatekeeper blocks the unsigned app on first launch, run `xattr -cr "/Applications/T3 Code (Beta).app"` (or Right-click → Open).
          - **Windows (x64 `.exe`)**: If SmartScreen prompts, choose **More info → Run anyway**.
          EOF
          )
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$TAG" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Unofficial Fork Desktop Build (${TAG})" \
              --notes "$NOTES" \
              --prerelease
          fi
